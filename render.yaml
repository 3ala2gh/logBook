# Render Blueprint for the Django API (free web service).
# New > Blueprint > pick this repo. Fill in the values marked sync: false.
services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://eld-trip-planner.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false # optional, for Vercel preview URLs
      - key: ORS_API_KEY
        sync: false # free key from openrouteservice.org; without it OSRM is used
      - key: GEOCODER_USER_AGENT
        sync: false # e.g. eld-trip-planner/1.0 (you@example.com)
